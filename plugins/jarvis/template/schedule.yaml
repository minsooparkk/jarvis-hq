# 예약 실행 목록. jarvisd 가 '상태: 켬' 인 것만 돌린다. 시각은 설정한 시간대(기본 한국), 언제는 cron(분 시 일 월 요일).
# 종류: 지시(Claude 가 판단) | 스크립트(프로그램만, 이 파일이 있는 폴더에서 돈다) | 승인묶음(결정 안 한 승인을 다시 알림)
# 보낼곳: DM 또는 그룹 토픽 이름(설정에 없으면 DM). 비워 두면 결과를 올리지 않는다(실패는 알림).
# 지시에는 긴 글을 쓰지 않는다. 절차는 스킬 문서에 두고 '스킬을 읽고 그대로' 한 줄만.
# 스킬 폴더(skills/<이름>/schedule.yaml)에도 같은 모양으로 둘 수 있다(그 스킬의 스크립트 예약).
작업:
  - 이름: 아침-요약
    언제: "0 9 * * *"
    종류: 지시
    실행: "스킬 jarvis:morning-evening 을 읽고 '아침' 절을 그대로 한다."
    보낼곳: DM
    상태: 켬
  - 이름: 승인-다시-알림
    언제: "0 9,18 * * *"
    종류: 승인묶음
    보낼곳: DM
    상태: 켬
  - 이름: 저녁-요약
    언제: "0 18 * * *"
    종류: 지시
    실행: "스킬 jarvis:morning-evening 을 읽고 '저녁' 절을 그대로 한다."
    보낼곳: DM
    상태: 켬
  - 이름: 오늘-일정
    언제: "30 8 * * 1-5"
    종류: 지시
    실행: "스킬 jarvis:daily-brief 를 읽고 그대로 한다."
    보낼곳: DM
    상태: 끔   # 캘린더 연결(MCP)을 마친 뒤 켬
  - 이름: 되돌리기-훈련
    언제: "30 9 * * 1"
    종류: 지시
    실행: "rules/04-실수-허용과-보완.md '되돌리기 훈련'을 .harness/work/drill/ 의 시험 파일로 한 번 하고, 되돌리기·기록 남기기가 됐는지 세 줄로 알린다."
    보낼곳: DM
    상태: 끔
